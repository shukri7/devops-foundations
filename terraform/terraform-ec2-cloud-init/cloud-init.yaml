
#cloud-config

package_update: true

packages:
  - nginx

write_files:
  - path: /var/www/html/index.html
    permissions: '0644'
    defer: true
    content: |
      <html>
        <head><title>Terraform Cloud-init</title></head>
        <body>
          <h1>Deployed with Terraform and Cloud-init!</h1>
          <p>Nginx was installed automatically.</p>
        </body>
      </html>

runcmd:
  - systemctl enable --now nginx
